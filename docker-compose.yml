version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: transitops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: transitops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - transitops_pgdata:/var/lib/postgresql/data

volumes:
  transitops_pgdata:
